#!/usr/bin/env bash
# =============================================================================
# rvnXC default configuration. Copy to mytarget.cfg and pass with -f to
# override per engagement without touching this file.
# Secrets (API keys, webhooks) belong in .env, NOT here — see .env.example.
# =============================================================================

tools="${HOME}/Tools"
resolvers="${tools}/resolvers.txt"
DATA_DIR="${SCRIPTPATH}/data"
WORDLISTS_DIR="${DATA_DIR}/wordlists"
fuzz_wordlist="${WORDLISTS_DIR}/fuzz_wordlist.txt"
subs_wordlist="${WORDLISTS_DIR}/subdomains.txt"
NUCLEI_TEMPLATES_PATH="${HOME}/nuclei-templates"

MIN_DISK_SPACE_GB=2
STRUCTURED_LOGGING=false

# ---- OSINT -----------------------------------------------------------------
DOMAIN_INFO=true
MAIL_HYGIENE=true
GITHUB_LEAKS=true
CLOUD_ENUM=true

# ---- Subdomains --------------------------------------------------------------
SUBPASSIVE=true
SUBBRUTE=true
SUBPERMUTE=true
SUBTAKEOVER=true
INSCOPE=false
SCOPE_FILE=".scope"

# ---- Web -----------------------------------------------------------------------
WEBPROBEFULL=true
WEBSCREENSHOT=true
URL_CHECK=true
URL_GF=true
JSCHECKS=true
FUZZ=true
FUZZ_TOP_HOSTS=20

# ---- Vulns (only runs in -a / "all" mode, after authorization confirmation) ----
NUCLEICHECK=true
NUCLEI_SEVERITY="info,low,medium,high,critical"
NUCLEI_EXTRA_ARGS=""
XSS=true
CRLF_CHECKS=true
SQLI=true
SQLMAP=false            # Never auto-invoked; rvnXC only prints candidate URLs + the manual command
FUZZPARAMS=true
PARAM_DISCOVERY_TOP=15

# ---- Reporting / automation ------------------------------------------------------
ASSET_STORE=true
HOTLIST_TOP=50
DIFF=false

# ---- Notifications (webhooks live in .env) -----------------------------------
NOTIFICATION=false

# ---- Rate limiting / threads ----------------------------------------------------
HTTPX_THREADS=50
HTTPX_RATELIMIT=150
HTTPX_TIMEOUT=10
NUCLEI_RATELIMIT=150
FFUF_THREADS=40
FFUF_RATELIMIT=0
FFUF_MAXTIME=300
DALFOX_THREADS=100
ARJUN_THREADS=10

ADAPTIVE_RATE_LIMIT=false
MIN_RATE_LIMIT=10
MAX_RATE_LIMIT=500
RATE_LIMIT_BACKOFF_FACTOR=0.5
RATE_LIMIT_INCREASE_FACTOR=1.2
